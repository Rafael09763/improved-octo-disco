<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">SmartTech MX</title>
    <style>
        /* --- Fondo de Universo Profesional --- */
        :root { 
            --bg-primary: #05070a; /* Negro azulado muy oscuro */
            --bg-secondary: rgba(17, 24, 39, 0.85); /* Fondo semitransparente para tarjetas */
            --accent-color: #2563eb; 
            --success-color: #10b981; 
            --text-main: #f3f4f6; 
            --text-muted: #9ca3af; 
            --border-color: #1f2937;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding-bottom: 100px; 
            color: var(--text-main);
            
            /* Imagen de fondo de estrellas (patrón sutil) */
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            background-attachment: fixed; /* El fondo se queda fijo al hacer scroll */
        }

        /* Efecto sutil de nebulosa/luz lejana */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 900px; margin: auto; padding: 20px; }
        
        .product-card { 
            background: var(--bg-secondary); 
            backdrop-filter: blur(10px); /* Efecto de vidrio esmerilado */
            padding: 24px; 
            border-radius: 16px; 
            margin-bottom: 30px; 
            text-align: center; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        }

        .product-card img { 
            width: 100%; 
            height: 250px; 
            object-fit: contain; 
            background: #ffffff; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            padding: 5px;
        }

        .photo-gallery { display: flex; gap: 10px; justify-content: center; margin: 15px 0; overflow-x: auto; padding-bottom: 5px; }
        .photo-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; background: #fff; opacity: 0.6; transition: 0.2s; }
        .photo-thumb:hover { opacity: 1; }
        .photo-thumb.active { border-color: var(--accent-color); opacity: 1; transform: scale(1.05); }

        .product-price { font-size: 1.5rem; font-weight: 700; color: var(--success-color); margin: 12px 0; }
        .product-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px; white-space: pre-line; }

        .btn { background: var(--accent-color); color: white; padding: 16px; border-radius: 12px; text-align: center; display: block; cursor: pointer; border: none; width: 100%; font-weight: bold; margin-top: 15px; text-decoration: none; font-size: 1rem; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); z-index: 9999999; padding: 20px; overflow-y: auto; }
        .admin-group { background: rgba(30, 41, 59, 0.5); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #475569; }
        .sub-group { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed #64748b; }
        .info-box { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; color: #4ade80; margin-top: 10px; font-size: 0.9rem; word-wrap: break-word; }
        input, textarea { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        label { color: #e2e8f0; font-weight: 500; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <audio id="welcomeSound"></audio>

    <div class="container">
        <h1 id="mainTitle" style="text-align: center; font-size: 2.5rem; margin-bottom: 40px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">SmartTech MX</h1>
        <div id="productContainer"></div>
    </div>

    <button class="btn" style="position:fixed; bottom:30px; right:30px; width:65px; height:65px; border-radius:50%; z-index:999999; padding:0; box-shadow: 0 5px 20px rgba(37, 99, 235, 0.5);" onclick="checkAdmin()">⚙️</button>

    <div id="modal" class="modal">
        <div class="container">
            <h2 style="color: var(--accent-color);">Panel Administrativo Profesional</h2>
            
            <div class="admin-group">
                <h3>📊 Registro del Visitante (Educativo)</h3>
                <div id="visitorInfo" class="info-box">Cargando datos...</div>
            </div>

            <div class="admin-group">
                <h3>⚙️ Configuración del Sitio</h3>
                <label>Nombre de la Página:</label>
                <input type="text" id="inTitle" onchange="saveConfig('sTitle', this.value)">
                <label>Sonido de Bienvenida (Elegir archivo):</label>
                <input type="file" accept="audio/*" onchange="handleFile(event, 'welcomeSound', 'sAudio')">
                <button class="btn" onclick="addProduct()">+ Agregar Nuevo Producto</button>
            </div>

            <h3>📦 Gestión de Catálogo</h3>
            <div id="adminProductList"></div>
            
            <button class="btn" style="background:#dc2626; margin-top:30px;" onclick="document.getElementById('modal').style.display='none'">Cerrar Panel</button>
        </div>
    </div>

    <script>
        const PASSWORD_SEGURA = "2486"; 

        async function fetchVisitorData() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                const time = new Date().toLocaleString();
                const device = navigator.userAgent;
                
                document.getElementById('visitorInfo').innerHTML = `
                    IP: ${data.ip}<br>
                    Ubicación: ${data.city}, ${data.region}, ${data.country_name}<br>
                    Hora: ${time}<br>
                    Dispositivo: ${device.split('(')[1] ? device.split('(')[1].split(')')[0] : device}
                `;
            } catch (e) {
                document.getElementById('visitorInfo').innerText = "No se pudieron obtener los datos de red.";
            }
        }

        function checkAdmin() {
            const pass = prompt("Ingresa la contraseña de administrador:");
            if (pass === PASSWORD_SEGURA) {
                fetchVisitorData();
                document.getElementById('modal').style.display = 'block';
            } else {
                alert("Acceso denegado.");
            }
        }

        let products = JSON.parse(localStorage.getItem('myProducts')) || [
            {
                name: "Smartwatch Ultra Pro",
                price: "$2,499 MXN",
                description: "Pantalla AMOLED, GPS integrado, resistencia al agua 50M, batería de 7 días.",
                photos: [
                    "https://http2.mlstatic.com/D_NQ_NP_779747-MLM72549384966_112023-O.jpg",
                    "https://http2.mlstatic.com/D_NQ_NP_913579-MLM72549336995_112023-O.jpg"
                ]
            }
        ];

        function render() {
            const container = document.getElementById('productContainer');
            const adminList = document.getElementById('adminProductList');
            container.innerHTML = '';
            adminList.innerHTML = '';

            products.forEach((p, pIndex) => {
                if(!p.photos || p.photos.length === 0) p.photos = ["https://via.placeholder.com/300x250?text=Sin+Foto"];
                if(p.activePhoto === undefined || p.activePhoto >= p.photos.length) p.activePhoto = 0;
                if(!p.description) p.description = "";

                let currentPhoto = p.photos[p.activePhoto];

                let thumbsHTML = '';
                p.photos.forEach((photoUrl, photoIndex) => {
                    let activeClass = (photoIndex === p.activePhoto) ? 'active' : '';
                    thumbsHTML += `<img src="${photoUrl}" class="photo-thumb ${activeClass}" onclick="changePhoto(${pIndex}, ${photoIndex})">`;
                });

                // Vista Principal
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${currentPhoto}">
                        <h2>${p.name}</h2>
                        <div class="product-price">${p.price}</div>
                        <div class="product-desc">${p.description}</div>
                        <div class="photo-gallery">
                            ${thumbsHTML}
                        </div>
                    </div>`;

                // Vista Admin
                let adminPhotosHTML = '';
                p.photos.forEach((photoUrl, photoIndex) => {
                    adminPhotosHTML += `
                        <div class="sub-group">
                            <label>Foto #${photoIndex + 1}:</label>
                            <div style="display:flex; gap:10px; align-items:center; margin-top:8px;">
                                <img src="${photoUrl}" style="width:60px; height:60px; object-fit:contain; background:#fff; border-radius:8px;">
                                <input type="file" accept="image/*" onchange="handlePhotoUpdate(event, ${pIndex}, ${photoIndex})">
                                <button class="btn" style="background:#dc2626; padding:10px; width:auto;" onclick="deletePhoto(${pIndex}, ${photoIndex})">❌</button>
                            </div>
                        </div>`;
                });

                adminList.innerHTML += `
                    <div class="admin-group">
                        <h4 style="color:var(--accent-color); margin-bottom:10px;">Editar Producto #${pIndex + 1}</h4>
                        <label>Nombre:</label>
                        <input type="text" value="${p.name}" onchange="updateProductField(${pIndex}, 'name', this.value)">
                        <label>Precio:</label>
                        <input type="text" value="${p.price}" onchange="updateProductField(${pIndex}, 'price', this.value)">
                        <label>Descripción:</label>
                        <textarea rows="3" onchange="updateProductField(${pIndex}, 'description', this.value)">${p.description}</textarea>
                        
                        <h5 style="margin-top:15px; color:#cbd5e1;">Galería de Fotos:</h5>
                        ${adminPhotosHTML}
                        
                        <button class="btn" style="background:#16a34a; margin-top:15px;" onclick="addPhotoToProduct(${pIndex})">+ Agregar otra foto</button>
                        <button class="btn" style="background:#b91c1c; margin-top:10px;" onclick="deleteProduct(${pIndex})">🗑️ Eliminar Producto Completo</button>
                    </div>`;
            });

            localStorage.setItem('myProducts', JSON.stringify(products));
        }

        function changePhoto(pIndex, photoIndex) {
            products[pIndex].activePhoto = photoIndex;
            render();
        }

        function addProduct() { 
            products.push({name: "Nuevo Producto", price: "$0", description: "Detalles...", photos: ["https://via.placeholder.com/300x250"], activePhoto: 0}); 
            render(); 
        }

        function deleteProduct(pIndex) { 
            if(confirm("¿Estás seguro de eliminar este producto?")) {
                products.splice(pIndex, 1); 
                render(); 
            }
        }

        function addPhotoToProduct(pIndex) {
            products[pIndex].photos.push("https://via.placeholder.com/300x250");
            render();
        }

        function deletePhoto(pIndex, photoIndex) {
            if(products[pIndex].photos.length <= 1) {
                alert("El producto debe tener al menos una foto.");
                return;
            }
            products[pIndex].photos.splice(photoIndex, 1);
            products[pIndex].activePhoto = 0;
            render();
        }

        function updateProductField(pIndex, key, val) {
            products[pIndex][key] = val;
            localStorage.setItem('myProducts', JSON.stringify(products));
        }

        function handlePhotoUpdate(e, pIndex, photoIndex) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                products[pIndex].photos[photoIndex] = ev.target.result;
                render();
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function saveConfig(key, val) {
            localStorage.setItem(key, val);
            // No recargamos
