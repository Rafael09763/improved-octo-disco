<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Smartwatches</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #334155; }
        h1 { font-size: 2.2rem; color: var(--accent); }
        
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .product-card { background: var(--panel); border-radius: 12px; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .product-image { height: 180px; background: #fff; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-image img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .price { font-size: 1.5rem; font-weight: bold; color: #4ade80; margin: 10px 0; }
        
        .btn { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; display: inline-block; text-decoration: none; text-align: center; }
        .btn:hover { background: var(--accent-hover); }
        .btn-success { background: #22c55e; }
        .btn-secondary { background: #475569; }
        .btn-danger { background: #ef4444; }
        
        /* Botón flotante Admin */
        .admin-float-btn { position: fixed; bottom: 20px; right: 20px; background: #334155; color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000; }
        
        /* Modal Admin */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1001; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); padding: 25px; border-radius: 12px; width: 90%; max-width: 480px; text-align: center; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
        
        label { display: block; text-align: left; font-size: 0.85rem; color: #94a3b8; margin-top: 10px; }
        input[type="password"], input[type="text"], input[type="number"], input[type="file"], select { width: 100%; padding: 10px; margin: 5px 0 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
        
        .admin-view { text-align: left; margin-top: 15px; display: none; }
        .admin-nav { display: flex; gap: 8px; margin-bottom: 15px; }
        .admin-nav button { padding: 8px 12px; font-size: 0.85rem; flex: 1; }
        .product-edit-box { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .stat-card { background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; border: 1px solid #334155; }
        .stat-num { font-size: 2.5rem; font-weight: bold; color: #3b82f6; }
        .preview-img { width: 100%; height: 120px; object-fit: contain; background: #fff; border-radius: 6px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <header class="container">
        <h1>Smartwatches Exclusivos</h1>
        <p>Encuentra el reloj inteligente perfecto para ti</p>
    </header>

    <main class="container">
        <div class="products" id="productsContainer">
            <!-- Productos cargados dinámicamente -->
        </div>
    </main>

    <!-- Botón Flotante para el Panel -->
    <button class="admin-float-btn" onclick="openAdminModal()">⚙️</button>

    <!-- Ventana Modal de Administración -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAdminModal()">&times;</span>
            <h2>Panel Administrativo</h2>
            
            <!-- Vista 1: Login -->
            <div id="loginSection">
                <p style="margin-top: 10px; color: #94a3b8;">Ingresa el PIN para entrar:</p>
                <input type="password" id="pinInput" placeholder="PIN" maxlength="4">
                <button class="btn" onclick="checkPin()">Ingresar</button>
                <p id="adminMessage" style="margin-top: 15px; color: #ef4444; display: none;"></p>
            </div>

            <!-- Vista 2: Panel Completo -->
            <div id="optionsSection" class="admin-view">
                <div class="admin-nav">
                    <button class="btn btn-secondary" onclick="showTab('productsTab')">📦 Productos</button>
                    <button class="btn btn-secondary" onclick="showTab('statsTab')">📊 Visitas</button>
                    <button class="btn btn-secondary" onclick="showTab('configTab')">🔗 Facebook</button>
                </div>

                <!-- Pestaña 1: Productos -->
                <div id="productsTab" class="tab-content">
                    <label>Selecciona el producto a editar:</label>
                    <select id="productSelect" onchange="loadProductToEdit()">
                        <option value="0">SmartWatch Pro</option>
                        <option value="1">SmartWatch Llamadas</option>
                        <option value="2">SmartWatch Básico</option>
                    </select>

                    <div class="product-edit-box">
                        <label>Nombre del Producto:</label>
                        <input type="text" id="editTitle">

                        <label>Descripción:</label>
                        <input type="text" id="editDesc">

                        <label>Precio (MXN):</label>
                        <input type="number" id="editPrice">

                        <label>Foto del Producto (Galería):</label>
                        <input type="file" id="editImageFile" accept="image/*" onchange="handleImageUpload(event)">
                        <img id="imgPreview" class="preview-img" alt="Vista previa">
                    </div>

                    <button class="btn btn-success" onclick="saveProductChanges()">💾 Guardar Producto</button>
                </div>

                <!-- Pestaña 2: Estadísticas -->
                <div id="statsTab" class="tab-content" style="display:none;">
                    <div class="stat-card">
                        <p style="color: #94a3b8;">Visitas Totales a la Tienda</p>
                        <div class="stat-num" id="visitCount">0</div>
                    </div>
                </div>

                <!-- Pestaña 3: Configuración Facebook -->
                <div id="configTab" class="tab-content" style="display:none;">
                    <div class="product-edit-box">
                        <label>Enlace/Perfil de Facebook:</label>
                        <input type="text" id="fbLinkInput" placeholder="https://facebook.com/tu-pagina">
                    </div>
                    <button class="btn btn-success" onclick="saveFbLink()">💾 Guardar Enlace</button>
                </div>

                <button class="btn btn-danger" onclick="logoutAdmin()" style="margin-top: 15px;">Cerrar Panel</button>
            </div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { title: "SmartWatch Pro", desc: "Ideal para deportes y monitoreo de salud.", price: 799, image: "https://i5.walmartimages.com/seo/Smartwatch-Deportivo-Inteligente-Pantalla-Tactil-Notificaciones_4a8996b7-87eb-4b2a-8998-ef2fb4c75945.jpg" },
            { title: "SmartWatch Llamadas", desc: "Responde y realiza llamadas directamente.", price: 499, image: "https://i5.walmartimages.com/seo/Smartwatch-Con-Llamadas-Bluetooth-Notificaciones-Reloj-Inteligente_2ff8fb28-20d0-42f8-9419-756ef2494101.jpg" },
            { title: "SmartWatch Básico", desc: "Cuenta pasos y muestra notificaciones.", price: 299, image: "https://i5.walmartimages.com/seo/Reloj-Inteligente-Smartwatch-Band-Notificaciones_0c4c4e7f-b2e1-4c10-9c2b-e10b1a052b91.jpg" }
        ];

        let isAdminLoggedIn = false;
        let tempBase64Image = "";

        function trackVisits() {
            let visits = parseInt(localStorage.getItem('store_visits') || '0');
            visits++;
            localStorage.setItem('store_visits', visits.toString());
            document.getElementById('visitCount').innerText = visits;
        }

        function getProducts() {
            const saved = localStorage.getItem('my_store_products');
            return saved ? JSON.parse(saved) : defaultProducts;
        }

        function getFbLink() {
            return localStorage.getItem('fb_contact_link') || '#';
        }

        function renderProducts() {
            const products = getProducts();
            const fbLink = getFbLink();
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-image">
                            <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/200?text=Sin+Imagen'">
                        </div>
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                        <div class="price">$${p.price} MXN</div>
                        <a class="btn" href="${fbLink}" target="_blank">Comprar en Facebook</a>
                    </div>
                `;
            });
        }

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
            if (isAdminLoggedIn) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('optionsSection').style.display = 'block';
            }
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkPin() {
            const pin = document.getElementById('pinInput').value;
            const message = document.getElementById('adminMessage');
            
            if (pin === '2468') {
                isAdminLoggedIn = true;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('optionsSection').style.display = 'block';
                loadProductToEdit();
                document.getElementById('fbLinkInput').value = getFbLink();
            } else {
                message.innerText = 'PIN incorrecto. Intenta de nuevo.';
                message.style.display = 'block';
            }
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempBase64Image = e.target.result;
                    const preview = document.getElementById('imgPreview');
                    preview.src = tempBase64Image;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function loadProductToEdit() {
            const products = getProducts();
            const index = document.getElementById('productSelect').value;
            const p = products[index];

            document.getElementById('editTitle').value = p.title;
            document.getElementById('editDesc').value = p.desc;
            document.getElementById('editPrice').value = p.price;
            document.getElementById('editImageFile').value = '';
            
            tempBase64Image = p.image;
            const preview = document.getElementById('imgPreview');
            preview.src = p.image;
            preview.style.display = 'block';
        }

        function saveProductChanges() {
            const products = getProducts();
            const index = document.getElementById('productSelect').value;

            products[index] = {
                title: document.getElementById('editTitle').value,
                desc: document.getElementById('editDesc').value,
                price: document.getElementById('editPrice').value,
                image: tempBase64Image
            };

            localStorage.setItem('my_store_products', JSON.stringify(products));
            renderProducts();
            alert('¡Producto y foto actualizados con éxito!');
        }

        function saveFbLink() {
            const link = document.getElementById('fbLinkInput').value;
            localStorage.setItem('fb_contact_link', link);
            renderProducts();
            alert('¡Enlace de Facebook guardado!');
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('pinInput').value = '';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('optionsSection').style.display = 'none';
            closeAdminModal();
        }

        trackVisits();
        renderProducts();
    </script>
</body>
</html>
