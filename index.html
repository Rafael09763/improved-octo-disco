<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">SmartTech MX</title>
    <style>
        :root { --bg-primary: #070913; --bg-secondary: #0f172a; --accent-color: #3b82f6; --text-main: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg-primary); color: var(--text-main); margin: 0; padding-bottom: 100px; }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .product-card { background: var(--bg-secondary); padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; border: 1px solid #1e293b; }
        .product-card img { width: 100%; height: 200px; object-fit: contain; background: white; border-radius: 10px; margin-bottom: 10px; }
        .btn { background: var(--accent-color); color: white; padding: 15px; border-radius: 10px; text-align: center; display: block; cursor: pointer; border: none; width: 100%; font-weight: bold; margin-top: 10px; text-decoration: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999999; padding: 20px; overflow-y: auto; }
        .admin-group { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #444; background: #000; color: #fff; }
    </style>
</head>
<body>

    <audio id="welcomeSound"></audio>

    <div class="container">
        <h1 id="mainTitle">SmartTech MX</h1>
        <div id="linkContainer">
            <a id="btnMP" href="#" class="btn">Mercado Pago</a>
            <a id="btnFB" href="#" class="btn">Facebook</a>
            <a id="btnWA" href="#" class="btn">WhatsApp</a>
        </div>
        <div id="productContainer" style="margin-top: 20px;"></div>
    </div>

    <button class="btn" style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; z-index:999999" onclick="document.getElementById('modal').style.display='block'">⚙️</button>

    <div id="modal" class="modal">
        <div class="container">
            <h2>Panel Administrativo</h2>
            
            <div class="admin-group">
                <label>Nombre de la Página:</label>
                <input type="text" id="inTitle" onchange="saveConfig('sTitle', this.value)">
                <label>Links (MP, FB, WA):</label>
                <input type="text" id="inMP" placeholder="Link Mercado Pago" onchange="saveConfig('sMP', this.value)">
                <input type="text" id="inFB" placeholder="Link Facebook" onchange="saveConfig('sFB', this.value)">
                <input type="text" id="inWA" placeholder="Link WhatsApp" onchange="saveConfig('sWA', this.value)">
            </div>

            <div class="admin-group">
                <label>Sonido de Bienvenida:</label>
                <input type="file" accept="audio/*" onchange="handleFile(event, 'welcomeSound', 'sAudio')">
                <button class="btn" onclick="addProduct()">+ Agregar Nuevo Producto</button>
            </div>

            <div id="adminProductList"></div>
            
            <button class="btn" style="background:red" onclick="document.getElementById('modal').style.display='none'">Cerrar Panel</button>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('myProducts')) || [];

        function render() {
            const container = document.getElementById('productContainer');
            const adminList = document.getElementById('adminProductList');
            container.innerHTML = '';
            adminList.innerHTML = '';

            products.forEach((p, i) => {
                container.innerHTML += `<div class="product-card"><h2>${p.name}</h2><p>${p.price}</p></div>`;
                adminList.innerHTML += `
                    <div class="admin-group">
                        <input type="text" value="${p.name}" onchange="updateProd(${i}, 'name', this.value)" placeholder="Nombre">
                        <input type="text" value="${p.price}" onchange="updateProd(${i}, 'price', this.value)" placeholder="Precio">
                        <button class="btn" style="background:red" onclick="deleteProd(${i})">Eliminar</button>
                    </div>`;
            });
            localStorage.setItem('myProducts', JSON.stringify(products));
        }

        function saveConfig(key, val) {
            localStorage.setItem(key, val);
            location.reload();
        }

        function handleFile(e, id, key) {
            const reader = new FileReader();
            reader.onload = (ev) => { localStorage.setItem(key, ev.target.result); document.getElementById(id).src = ev.target.result; alert('Guardado'); };
            reader.readAsDataURL(e.target.files[0]);
        }

        function addProduct() { products.push({name: "Nuevo", price: "$0"}); render(); }
        function deleteProd(i) { products.splice(i, 1); render(); }
        function updateProd(i, k, v) { products[i][k] = v; render(); }

        window.onload = () => {
            if(localStorage.getItem('sTitle')) { document.getElementById('mainTitle').innerText = localStorage.getItem('sTitle'); document.getElementById('docTitle').innerText = localStorage.getItem('sTitle'); }
            if(localStorage.getItem('sAudio')) document.getElementById('welcomeSound').src = localStorage.getItem('sAudio');
            if(localStorage.getItem('sMP')) document.getElementById('btnMP').href = localStorage.getItem('sMP');
            if(localStorage.getItem('sFB')) document.getElementById('btnFB').href = localStorage.getItem('sFB');
            if(localStorage.getItem('sWA')) document.getElementById('btnWA').href = localStorage.getItem('sWA');
            document.body.addEventListener('click', () => { document.getElementById('welcomeSound').play(); }, { once: true });
            render();
        };
    </script>
</body>
    </html>
